
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 7</title>
  <style>
    /* List ko horizontal menu bana rahe hain */
    nav ul {
      list-style: none;          /* bullets hata diye */
      margin: 0;
      padding: 0;
      background-color: #333;    /* dark bar */
    }

    nav li {
      display: inline-block;     /* items ek line me aa gaye */
    }

    nav a {
      display: block;
      padding: 10px 16px;
      color: white;
      text-decoration: none;
    }

    nav a:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#courses">Courses</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
</body>
</html>
