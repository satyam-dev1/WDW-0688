
<!DOCTYPE html>
<!-- lang attribute screen reader ko page ki language batata hai -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 11 - Accessibility</title>
  <style>
    /* Keyboard se tab karne par element saaf dikhe */
    a:focus, button:focus, input:focus {
      outline: 3px solid orange;
    }
  </style>
</head>
<body>
  <!-- Skip link: keyboard user seedha main content par ja sakta hai -->
  <a href="#main">Skip to main content</a>

  <!-- aria-label se screen reader ko nav ka naam pata chalta hai -->
  <nav aria-label="Main navigation">
    <a href="#home">Home</a>
    <a href="#help">Help</a>
  </nav>

  <main id="main">
    <h1>Accessible Page</h1>

    <!-- alt text image ka description deta hai -->
    <img src="banner.jpg" alt="College banner showing the main building" width="300" height="80">
    <button type="button" aria-label="Close">X</button>

    <p>
      <label for="search">Search:</label>
      <input type="text" id="search" name="search">
    </p>
  </main>
</body>
</html>
