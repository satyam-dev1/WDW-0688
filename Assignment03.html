
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 3</title>
  <style>
    /* Block elements: poori width lete hain, nayi line se start hote hain */
    div {
      background-color: lightblue;
      margin: 2px 0;
    }

    /* Inline elements: sirf content jitni jagah lete hain, same line me rehte hain */
    span {
      background-color: lightgreen;
    }
  </style>
</head>
<body>
  <div>Block 1</div>
  <div>Block 2</div>

  <span>Inline 1</span>
  <span>Inline 2</span>
  <span>Inline 3</span>
</body>
</html>
